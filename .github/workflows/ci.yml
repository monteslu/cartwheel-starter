name: CI

# Every push: build the game on Linux and macOS, run the checks that need no
# GPU (the prompt check), and package it for every platform. The checks that
# run the cart (./test.sh: newcomer, grounding, flash, text, quality) need the
# romdev server and a GPU: run them before you push. A v* tag
# (./release.sh v0.1.0) also publishes the packages as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a push to main never wipes out the run before it: a tag needs that run green

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, test: true }
          - { target: linux-arm64, os: ubuntu-24.04-arm, test: true }
          - { target: macos-arm64, os: macos-15, test: true }
          - { target: windows-x64, os: ubuntu-24.04, test: false } # its runtime DLLs are added on Windows below
          - { target: android-arm64, os: ubuntu-24.04, test: false } # launched on an emulator below
          - { target: wasc, os: ubuntu-24.04, test: false } # the one cart: GL and WebGPU in one .wasc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build squashfs-tools zip \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Android SDK and NDK
        if: matrix.target == 'android-arm64'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/deps.lock') }}
      - name: Build
        if: matrix.test
        run: ./build.sh
      - name: Checks that need no GPU (the prompt check and its control)
        if: matrix.test
        run: ./test.sh prompts
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          scripts/package.sh ${{ matrix.target }} "$v"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: windows-x64 (runtime DLLs)
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-windows-x64
          path: packages
      - name: Microsoft's Visual C++ runtime, which Dawn links, into the package
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = (Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1).FullName
          $dlls = 'msvcp140.dll','msvcp140_atomic_wait.dll','vcruntime140.dll','vcruntime140_1.dll'
          foreach ($z in Get-ChildItem packages\*.zip) {
            $top = $z.BaseName
            New-Item -ItemType Directory -Force "stage\$top" | Out-Null
            foreach ($d in $dlls) { Copy-Item "$crt\$d" "stage\$top\" }
            Push-Location stage; 7z a -tzip $z.FullName "$top\*.dll" | Out-Null; Pop-Location
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64-final
          path: packages/*.zip
          retention-days: 30

  android:
    name: android-arm64 (launch)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-android-arm64
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on an emulator (x86_64 image running the arm64 APK)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            id=$(sed -n 's/^app_id *= *//p' project.cwproj) && adb install -r apk/*.apk && adb logcat -c && adb shell monkey -p "$id" -c android.intent.category.LAUNCHER 1 && sleep 25 && adb logcat -d -s cartwheel:* | grep -E 'WebGPU|GL:' ; adb shell pidof "$id" || (adb logcat -d | tail -60; exit 1)

  release:
    name: Release
    needs: [build, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write # the tagged commit's run on main, rerun when a later push cancelled it
    steps:
      # tag only commits whose push to main has a green CI run (never release an unchecked commit). The tag is
      # usually pushed right after main, while that run is still going: wait for it, a look a minute, up to 3 hours.
      # A run cancelled by a later push (the group keeps one run pending) is run again, twice at most; a failure,
      # a commit that is not on main, or the time running out fails this job.
      - name: The tagged commit is green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          case "$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq .status 2>/dev/null)" in
            behind|identical) ;;
            *) echo "$sha is not on main: push it to main and let CI pass before tagging it" >&2; exit 1 ;;
          esac
          deadline=$(( $(date +%s) + 10800 )); reruns=0
          look() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$sha" \
              --limit 1 --json databaseId,status,conclusion,url \
              --jq '.[0] // empty | [.databaseId, .status, (.conclusion // "" | if . == "" then "-" else . end), .url] | join(" ")'
          }
          while :; do
            set -- $(look)
            if [ $# -eq 0 ]; then
              echo "$(date -u +%H:%M:%S) no CI run on main for $sha yet"
            else
              case "$2:$3" in
                completed:success) echo "green: run $1 ($4)"; exit 0 ;;
                completed:cancelled)
                  [ $reruns -lt 2 ] || { echo "the CI run on main for $sha was cancelled again ($4): rerun it, then rerun this one" >&2; exit 1; }
                  reruns=$((reruns + 1)); echo "$(date -u +%H:%M:%S) run $1 was cancelled: rerunning it ($reruns of 2) $4"
                  gh run rerun "$1" -R "$GITHUB_REPOSITORY" || exit 1
                  for i in 1 2 3 4 5 6; do sleep 10; set -- $(look); [ "$2" = completed ] || break; done ;;
                completed:*) echo "the CI run on main for $sha ended $3 ($4): fix main (or rerun that run), then rerun this one" >&2; exit 1 ;;
                *) echo "$(date -u +%H:%M:%S) waiting on run $1 ($2) $4" ;;
              esac
            fi
            [ "$(date +%s)" -lt "$deadline" ] || { echo "no green CI run on main for $sha after 3 hours" >&2; exit 1; }
            sleep 60
          done
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir files
          for d in release/release-*; do
            case "$d" in */release-windows-x64) continue ;; esac # the final zips come from the Windows job
            cp "$d"/* files/
          done
          ls -l files
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes files/*
